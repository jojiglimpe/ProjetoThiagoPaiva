<label>Produto: <input [(ngModel)]="produto"></label><br>
<label>Preço: <input type="number" [(ngModel)]="preco"></label><br>
<label>Quantidade: <input type="number" [(ngModel)]="quantidade"></label><br>

<p>Produto: {{ produto }}</p>
<p>Preço: R$ {{ preco }}</p>
<p>Quantidade: {{ quantidade }}</p>
<p>Total: R$ {{ preco * quantidade }}</p>
