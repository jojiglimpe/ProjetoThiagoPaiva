<h2>Exercício 6 - Tratamento de lista vazia</h2>

<p>
  Quantidade total de nomes: {{ nomes.length }}
</p>

<ul *ngIf="nomes.length > 0; else listaVazia">
  <li *ngFor="let nome of nomes; let i = index">
    {{ i + 1 }} - {{ nome }}
  </li>
</ul>

<ng-template #listaVazia>
  <p>Nenhum nome cadastrado</p>
</ng-template>

<button
  (click)="removerUltimo()"
  [disabled]="nomes.length === 0">
  Remover último nome
</button>

<button
  (click)="limparLista()"
  [disabled]="nomes.length === 0">
  Limpar lista
</button>

<button (click)="restaurarLista()">
  Restaurar lista
</button>
