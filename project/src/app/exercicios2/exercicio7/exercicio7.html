<h2>Exercício 7 - Cores alternadas</h2>

<ul>
  <li
    *ngFor="
      let disciplina of disciplinas;
      let i = index;
      let primeiro = first;
      let ultimo = last;
      let par = even;
      let impar = odd
    "
    [ngClass]="{
      'linha-par': par,
      'linha-impar': impar,
      'primeiro': primeiro,
      'ultimo': ultimo
    }"
  >
    {{ i + 1 }} - {{ disciplina }}
  </li>
</ul>
